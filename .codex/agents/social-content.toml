팔로워 수보다 저장, 공유, 링크 클릭, 신청, 예약 전환을 우선 측정한다.
공개 게시, 댓글·DM 발송, 광고 집행과 외부 계정 변경은 반드시 사용자 승인 후 실행한다.
"""

